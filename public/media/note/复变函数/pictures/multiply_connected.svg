<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="serif">
  <defs><marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#333"/></marker></defs>
  <!-- axes -->
  <line x1="40" y1="260" x2="380" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="200" y1="280" x2="200" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="375" y="278" font-size="16" font-style="italic">x</text>
  <text x="185" y="25" font-size="16" font-style="italic">y</text>
  <text x="205" y="275" font-size="14">o</text>
  <!-- outer curve l (counterclockwise) -->
  <path d="M100,230 Q60,140 120,70 Q200,10 310,60 Q370,120 340,200 Q310,260 220,265 Q130,265 100,230Z" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5"/>
  <polygon points="90,170 83,180 97,180" fill="#1e40af"/>
  <polygon points="230,18 240,15 235,28" fill="#1e40af"/>
  <polygon points="355,160 360,150 348,152" fill="#1e40af"/>
  <text x="80" y="90" font-size="16" font-style="italic" fill="#1e40af">l</text>
  <!-- inner hole -->
  <path d="M180,170 Q165,140 185,120 Q210,105 235,120 Q250,140 235,165 Q215,180 180,170Z" fill="white" stroke="#c0392b" stroke-width="2"/>
  <!-- inner curve direction (clockwise for hole boundary) -->
  <polygon points="172,150 168,158 180,155" fill="#c0392b"/>
  <polygon points="238,135 242,125 230,128" fill="#c0392b"/>
  <text x="195" y="150" font-size="14" font-style="italic" fill="#c0392b">l₁</text>
  <!-- cut line -->
  <line x1="235" y1="165" x2="310" y2="200" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="270" y="175" font-size="12" fill="#888">割线</text>
  <!-- region label -->
  <text x="120" y="210" font-size="16" font-weight="bold" fill="#1e40af">B̄</text>
  <!-- singularity -->
  <circle cx="205" cy="145" r="3" fill="#c0392b"/>
</svg>
