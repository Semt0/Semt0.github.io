<svg xmlns="http://www.w3.org/2000/svg" width="930" height="710" viewBox="0 0 930 710" role="img" aria-labelledby="title desc">
  <title id="title">Lab 2 接收与转发架构</title>
  <desc id="desc">main 注册设备并启动接收线程，经 receiveFrames 和 dispatchFrame 分发 ARP、IPv4 与距离向量报文；IPv4 数据报本机交付或经 TTL 处理后转发。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.4}.core{fill:#eff6ff;stroke:#60a5fa}.route{fill:#f0fdf4;stroke:#86be9d}.edge{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}.label{font:15px system-ui,-apple-system,'PingFang SC',sans-serif;fill:#334155}.name{font:16px system-ui,-apple-system,'PingFang SC',sans-serif;fill:#0f172a;font-weight:600}.hint{font:13px system-ui,-apple-system,'PingFang SC',sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="930" height="710" rx="12" fill="#fff"/>
  <path class="edge" d="M465 60 V90"/><path class="edge" d="M465 130 V160"/><path class="edge" d="M465 200 V230"/>
  <path class="edge" d="M465 270 V295 H130 V330"/><path class="edge" d="M465 270 V330"/><path class="edge" d="M465 270 V295 H800 V330"/>
  <path class="edge" d="M800 370 V420"/><path class="edge" d="M465 370 V395 H130 V445"/><path class="edge" d="M465 370 V445"/><path class="edge" d="M465 485 V525"/><path class="edge" d="M465 565 V605"/>
  <rect class="box core" x="335" y="20" width="260" height="40" rx="6"/><text class="name" x="465" y="45" text-anchor="middle">main 注册设备和回调</text>
  <rect class="box core" x="335" y="90" width="260" height="40" rx="6"/><text class="name" x="465" y="115" text-anchor="middle">每个接口的接收线程</text>
  <rect class="box core" x="335" y="160" width="260" height="40" rx="6"/><text class="name" x="465" y="185" text-anchor="middle">receiveFrames</text>
  <rect class="box core" x="335" y="230" width="260" height="40" rx="6"/><text class="name" x="465" y="255" text-anchor="middle">dispatchFrame</text>
  <text class="hint" x="132" y="320" text-anchor="middle">ARP</text><text class="hint" x="480" y="315">IPv4</text><text class="hint" x="799" y="320" text-anchor="middle">DV 0x88B6</text>
  <rect class="box" x="20" y="330" width="220" height="40" rx="6"/><text class="name" x="130" y="355" text-anchor="middle">handleARPframe</text>
  <rect class="box" x="355" y="330" width="220" height="40" rx="6"/><text class="name" x="465" y="355" text-anchor="middle">handleIPPacket</text>
  <rect class="box route" x="690" y="330" width="220" height="40" rx="6"/><text class="name" x="800" y="355" text-anchor="middle">handleDV</text>
  <rect class="box route" x="690" y="420" width="220" height="40" rx="6"/><text class="name" x="800" y="445" text-anchor="middle">更新选中的动态路径</text>
  <text class="hint" x="130" y="430" text-anchor="middle">任意注册接口的本机地址</text><text class="hint" x="480" y="425">可转发的非本机单播</text>
  <rect class="box" x="20" y="445" width="220" height="40" rx="6"/><text class="name" x="130" y="470" text-anchor="middle">已注册的 IP 回调</text>
  <rect class="box" x="310" y="445" width="310" height="40" rx="6"/><text class="name" x="465" y="470" text-anchor="middle">检查 TTL 与最长前缀路由</text>
  <rect class="box" x="290" y="525" width="350" height="40" rx="6"/><text class="name" x="465" y="550" text-anchor="middle">复制数据报、TTL 减一、重算校验和</text>
  <rect class="box" x="335" y="605" width="260" height="40" rx="6"/><text class="name" x="465" y="630" text-anchor="middle">sendFrame 发下一跳</text>
</svg>
