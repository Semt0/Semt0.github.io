<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <style>
    .title { font: 700 30px sans-serif; fill: #1f2937; }
    .subtitle { font: 18px sans-serif; fill: #4b5563; }
    .box-title { font: 700 19px sans-serif; fill: #111827; }
    .box-text { font: 16px sans-serif; fill: #374151; }
    .small { font: 16px sans-serif; fill: #374151; }
    .zf { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .construct { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .control { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .ac { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; }
    .arrow { stroke: #6b7280; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="600" y="52" text-anchor="middle" class="title">Axiomatic Set Theory: ZF and ZFC</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">从合法构造集合，到允许全局选择</text>

  <rect x="55" y="125" width="1090" height="290" rx="22" class="zf"/>
  <text x="600" y="162" text-anchor="middle" class="box-title">ZF：八类基本公理</text>

  <rect x="85" y="190" width="235" height="82" rx="12" class="construct"/>
  <text x="202" y="219" text-anchor="middle" class="box-title">外延 + 配对</text>
  <text x="202" y="247" text-anchor="middle" class="box-text">判断相等，构造有限集合</text>

  <rect x="340" y="190" width="235" height="82" rx="12" class="construct"/>
  <text x="457" y="219" text-anchor="middle" class="box-title">并集 + 幂集</text>
  <text x="457" y="247" text-anchor="middle" class="box-text">摊平集合，收集所有子集</text>

  <rect x="595" y="190" width="235" height="82" rx="12" class="construct"/>
  <text x="712" y="219" text-anchor="middle" class="box-title">无穷</text>
  <text x="712" y="247" text-anchor="middle" class="box-text">保证自然数等无穷对象</text>

  <rect x="850" y="190" width="265" height="82" rx="12" class="control"/>
  <text x="982" y="219" text-anchor="middle" class="box-title">分离 + 替换</text>
  <text x="982" y="247" text-anchor="middle" class="box-text">筛选与函数式映射</text>

  <rect x="300" y="305" width="260" height="78" rx="12" class="control"/>
  <text x="430" y="335" text-anchor="middle" class="box-title">正则 / 基础</text>
  <text x="430" y="362" text-anchor="middle" class="box-text">禁止成员循环与无限下降</text>

  <rect x="640" y="305" width="260" height="78" rx="12" class="control"/>
  <text x="770" y="335" text-anchor="middle" class="box-title">罗素悖论的防线</text>
  <text x="770" y="362" text-anchor="middle" class="box-text">不能任意生成 {x | P(x)}</text>

  <path d="M600 415 L600 472" class="arrow"/>
  <text x="600" y="454" text-anchor="middle" class="small">加入额外的全局选择原则</text>

  <rect x="175" y="490" width="850" height="150" rx="22" class="ac"/>
  <text x="600" y="530" text-anchor="middle" class="box-title">ZFC = ZF + AC</text>
  <text x="600" y="564" text-anchor="middle" class="box-text">选择公理：从每个非空集合中同时选出一个元素</text>
  <text x="600" y="594" text-anchor="middle" class="box-text">AC ⇔ 良序定理 ⇔ Zorn 引理</text>
  <text x="600" y="620" text-anchor="middle" class="box-text">典型应用：向量空间基、极大对象、Banach–Tarski 悖论</text>
</svg>
