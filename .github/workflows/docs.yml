name: Documentation
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -p 'test_*.py'
      - run: node --experimental-vm-modules --test tests/*.test.mjs
      - run: bash update.sh --check
      - run: uv run zensical build --clean
      - run: uv run python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: site
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
