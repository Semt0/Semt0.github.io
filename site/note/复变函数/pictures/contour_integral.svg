<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="serif">
  <!-- axes -->
  <line x1="40" y1="260" x2="380" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="280" x2="60" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#333"/></marker></defs>
  <text x="375" y="278" font-size="16" font-style="italic">x</text>
  <text x="45" y="25" font-size="16" font-style="italic">y</text>
