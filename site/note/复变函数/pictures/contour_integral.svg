  <circle cx="300" cy="100" r="4" fill="#c0392b"/>
  <text x="310" y="90" font-size="14" font-style="italic" fill="#c0392b">b</text>
  <!-- partition points -->
  <circle cx="155" cy="158" r="3" fill="#2c3e50"/>
  <text x="145" y="175" font-size="11" fill="#2c3e50">z₁</text>
  <circle cx="195" cy="135" r="3" fill="#2c3e50"/>
  <text x="185" y="150" font-size="11" fill="#2c3e50">z₂</text>
  <circle cx="240" cy="118" r="3" fill="#2c3e50"/>
